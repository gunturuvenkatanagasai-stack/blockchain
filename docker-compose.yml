version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: x402_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: x402_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: x402_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: x402_backend
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/x402_db
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8001
      ALGORAND_NETWORK: testnet
      ALGORAND_RPC_URL: https://testnet-api.algonode.cloud
      ALGORAND_INDEXER_URL: https://testnet-idx.algonode.cloud
    ports:
      - "8000:8000"
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: x402_ai_service
    ports:
      - "8001:8001"

volumes:
  pgdata:
